name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version from package.json packageManager field
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Agent-effect tests
        run: pnpm test:agent-effect
      - name: Agent-effect verify
        run: pnpm verify:agent-effect
      - name: CLI smoke (pass → 0, violate → 1)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm asa -- check corpus/auth02/pass.jsonl --profile corpus/auth02/profile.json
          pass_ec=$?
          set -e
          if [ "$pass_ec" -ne 0 ]; then
            echo "expected pass exit 0, got $pass_ec" >&2
            exit 1
          fi
          set +e
          pnpm asa -- check corpus/auth02/violate.jsonl --profile corpus/auth02/profile.json
          viol_ec=$?
          set -e
          if [ "$viol_ec" -ne 1 ]; then
            echo "expected violate exit 1, got $viol_ec" >&2
            exit 1
          fi
          echo "CLI smoke ok (pass=0, violate=1)"
